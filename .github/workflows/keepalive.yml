# Keeps the free Streamlit Cloud app awake and emails the repo owner (failed run) if it is broken.
name: keepalive

on:
  schedule:
    - cron: "7 */2 * * *"   # every 2 hours (Community Cloud sleeps apps after hours without visitors)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright==1.62.0 && python -m playwright install --with-deps chromium
      - run: python scripts/keepalive.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-screenshot
          path: keepalive_fail.png
          if-no-files-found: ignore
