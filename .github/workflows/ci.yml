name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruff · Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOOKROOM_AUTO_DOWNLOAD: "0"   # keep the suite offline: no model downloads during tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (without the optional local LLM)
        run: |
          grep -v -e llama-cpp-python -e extra-index-url requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements-ci.txt" "pytest>=8.0" "httpx>=0.27" ruff==0.17.3
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
